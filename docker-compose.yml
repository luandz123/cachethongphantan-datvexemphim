services:
  # ============================================================================
  # INFRASTRUCTURE DATABASES & MESSAGE BROKER
  # ============================================================================
  postgres-inventory:
    image: postgres:15-alpine
    container_name: postgres-inventory
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # Internal docker network communication (avoids conflicts with host PostgreSQL)
    expose:
      - "5432"
    volumes:
      - inventory_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  postgres-booking:
    image: postgres:15-alpine
    container_name: postgres-booking
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    expose:
      - "5432"
    volumes:
      - booking_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d booking_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    # Expose internally, and map to alternate ports to avoid conflict with host RabbitMQ
    ports:
      - "5674:5672"     # AMQP alternate port on host
      - "15674:15672"   # Management Web UI on http://localhost:15674
    expose:
      - "5672"
      - "15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 6

  # ============================================================================
  # MICROSERVICES
  # ============================================================================
  inventory-service:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    container_name: inventory-service
    environment:
      DB_HOST: postgres-inventory
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: inventory_db
      LOCK_STRATEGY: ${LOCK_STRATEGY:-pessimistic}
      PROTO_PATH: /app/shared/protos/inventory.proto
    volumes:
      - ./shared/protos:/app/shared/protos:ro
    ports:
      - "50052:50052"
      - "3002:3002"
    depends_on:
      postgres-inventory:
        condition: service_healthy

  booking-service:
    build:
      context: ./booking-service
      dockerfile: Dockerfile
    # Note: No container_name here to allow docker compose up --scale booking-service=3
    environment:
      DB_HOST: postgres-booking
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: booking_db
      INVENTORY_GRPC_URL: inventory-service:50052
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      INVENTORY_PROTO_PATH: /app/shared/protos/inventory.proto
      BOOKING_PROTO_PATH: /app/shared/protos/booking.proto
    volumes:
      - ./shared/protos:/app/shared/protos:ro
    expose:
      - "50051"
      - "3001"
    depends_on:
      postgres-booking:
        condition: service_healthy
      inventory-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  booking-lb:
    image: nginx:alpine
    container_name: booking-lb
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "50051:50051"
      - "8088:80"       # Health check on http://localhost:8088/health (avoids 8080)
    depends_on:
      - booking-service

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    environment:
      PORT: 3000
      INVENTORY_GRPC_URL: inventory-service:50052
      BOOKING_GRPC_URL: booking-lb:50051
      INVENTORY_PROTO_PATH: /app/shared/protos/inventory.proto
      BOOKING_PROTO_PATH: /app/shared/protos/booking.proto
    volumes:
      - ./shared/protos:/app/shared/protos:ro
    ports:
      - "3000:3000"
    depends_on:
      - booking-lb
      - inventory-service

volumes:
  inventory_pgdata:
  booking_pgdata:
