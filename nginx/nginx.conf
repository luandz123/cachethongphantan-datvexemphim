events {
    worker_connections 1024;
}

http {
    # Docker embedded DNS resolver
    resolver 127.0.0.11 valid=2s ipv6=off;

    log_format grpc_log '[$time_local] $remote_addr to: $upstream_addr '
                        'status: $status rt: $request_time';

    access_log /var/log/nginx/access.log grpc_log;
    error_log  /var/log/nginx/error.log notice;

    # gRPC Load Balancer for Booking Service
    server {
        listen 50051;
        http2 on;

        location / {
            # Dynamic resolution via Docker DNS allows detecting newly scaled containers
            set $booking_backend "booking-service:50051";
            grpc_pass grpc://$booking_backend;
            grpc_read_timeout 60s;
            grpc_send_timeout 60s;
        }
    }

    # Health check for Nginx load balancer
    server {
        listen 80;
        location /health {
            return 200 '{"status":"ok","component":"nginx-grpc-lb"}\n';
            add_header Content-Type application/json;
        }
    }
}
